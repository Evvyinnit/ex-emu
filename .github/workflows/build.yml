name: Build Ex Emu APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 23.0.7599858
  COMPILE_SDK: 35
  BUILD_TOOLS: 34.0.0
  APK_BASE: ExEmu-2.3.0-release

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "has_keystore=${HAS_KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Write signing config from secrets
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ex-emu-release.jks
          cat > keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=ex-emu-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
          ls -la ex-emu-release.jks keystore.properties

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tail -n 150

      - name: Verify APK exists
        run: |
          ls -la lemuroid-app/build/outputs/apk/release/ lemuroid-app/build/outputs/apk/debug/ 2>/dev/null || true
          find lemuroid-app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - name: Rename APK
        run: |
          cd lemuroid-app/build/outputs/apk/release
          if [ -f lemuroid-app-release.apk ]; then mv lemuroid-app-release.apk ${{ env.APK_BASE }}.apk; fi
          ls -la

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASE }}
          path: lemuroid-app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke-test:
    name: Emulator smoke test (prove it launches)
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          pattern: ExEmu-*
          merge-multiple: true
          path: apk

      - name: Boot emulator, install, launch, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke-test.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          pattern: ExEmu-*
          merge-multiple: true
          path: apk

      - name: Generate checksums
        run: |
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/*.apk
            apk/SHA256SUMS.txt
          generate_release_notes: true